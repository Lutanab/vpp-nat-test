[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-loadtest-server"
version = "0.1.0"
description = "Standalone L3/L4 server package for NAT load tests"
requires-python = ">=3.11"
dependencies = [
  "rich-click>=1.8.6",
]

[project.scripts]
nat-loadtest-server = "nat_loadtest_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
