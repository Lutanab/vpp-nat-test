[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-nat-worker"
version = "0.1.0"
description = "User VM worker for NAT benchmark steps"
requires-python = ">=3.11"
dependencies = [
  "rich-click>=1.8.6",
]

[project.scripts]
test-nat-worker = "nat_test.worker_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
