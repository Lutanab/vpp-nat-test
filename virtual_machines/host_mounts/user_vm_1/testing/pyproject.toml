[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-nat"
version = "0.1.0"
description = "Simple and load NAT test tooling"
requires-python = ">=3.11"
dependencies = [
  "rich-click>=1.8.6",
]

[project.scripts]
test-nat = "nat_test.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
