[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpp-nat-test"
version = "0.1.0"
description = "Workspace tools for the VPP NAT test repository"
requires-python = ">=3.11"
dependencies = [
  "rich-click>=1.8.6",
]

[project.scripts]
manage-nat = "manage_nat.cli:app"
test-nat = "test_nat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
