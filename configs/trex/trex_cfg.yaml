- port_limit: 2
  version: 2
  limit_memory: 1024
  port_bandwidth_gb: 200
  interfaces:
    - "--vdev=net_memif0,role=slave,id=0,socket-abstract=no,socket=/run/vpp/memif-inside-a.sock"
    - "--vdev=net_memif1,role=slave,id=0,socket-abstract=no,socket=/run/vpp/memif-outside.sock"
  port_info:
    - ip: 10.8.1.2
      default_gw: 10.8.1.1
    - ip: 10.8.0.2
      default_gw: 10.8.0.1
